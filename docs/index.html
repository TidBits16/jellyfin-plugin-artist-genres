<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Accepted genres — Artist Genres</title>
  <meta name="description" content="Every genre name the Artist Genres Jellyfin plugin will write: MusicBrainz official genres plus a few umbrellas." />
  <style>
    :root {
      --bg: #101014;
      --bg-2: #18181e;
      --line: #2a2a32;
      --text: #ececf1;
      --muted: #9a9aaa;
      --accent: #6ea8fe;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    main { max-width: 720px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
    h1 { font-size: 1.75rem; font-weight: 650; letter-spacing: -0.03em; margin: 0 0 0.4rem; }
    .lede { color: var(--muted); margin: 0 0 1.4rem; }
    input[type="search"] {
      width: 100%;
      background: var(--bg-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      font: inherit;
      margin: 0 0 1rem;
    }
    input[type="search"]:focus { outline: 1px solid var(--accent); }
    .meta {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      color: var(--muted);
      font-size: 0.85rem;
      margin: 0 0 0.6rem;
    }
    .list {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-2);
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.55rem 0.85rem;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 0; }
    .row:nth-child(even) { background: color-mix(in srgb, var(--bg) 45%, transparent); }
    .tag {
      color: var(--muted);
      font-size: 0.78rem;
      white-space: nowrap;
    }
    .pager {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      margin-top: 0.85rem;
    }
    button {
      background: var(--bg-2);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.4rem 0.8rem;
      font: inherit;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: default; }
    footer { margin-top: 2rem; color: var(--muted); font-size: 0.85rem; }
    .empty { padding: 1.2rem 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Accepted genres</h1>
    <p class="lede">Names the Artist Genres plugin will write. Most come from MusicBrainz. indie, alternative, soundtrack, and video game music are kept as umbrellas because MusicBrainz only lists the more specific names.</p>
    <input id="query" type="search" placeholder="Search genres…" autocomplete="off" />
    <div class="meta">
      <span id="count"></span>
      <span id="pageLabel"></span>
    </div>
    <div class="list" id="list"></div>
    <div class="pager">
      <button type="button" id="prev">Previous</button>
      <span id="pages"></span>
      <button type="button" id="next">Next</button>
    </div>
    <footer>
      <a href="https://github.com/TidBits16/jellyfin-plugin-artist-genres">jellyfin-plugin-artist-genres</a>
      · Official names from <a href="https://musicbrainz.org/genres">MusicBrainz</a>
    </footer>
  </main>
  <script>
    const PAGE_SIZE = 50;
    const UMBRELLAS = new Set(["indie", "alternative", "soundtrack", "video game music"]);
    let names = [];
    let filtered = [];
    let page = 0;

    function matches() {
      const q = document.getElementById("query").value.trim().toLowerCase();
      filtered = q ? names.filter((name) => name.toLowerCase().includes(q)) : names.slice();
      page = 0;
      render();
    }

    function render() {
      const pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (page > pages - 1) page = pages - 1;
      const start = page * PAGE_SIZE;
      const slice = filtered.slice(start, start + PAGE_SIZE);
      const list = document.getElementById("list");
      list.replaceChildren();
      if (slice.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No genres match that search.";
        list.appendChild(empty);
      } else {
        slice.forEach((name) => {
          const row = document.createElement("div");
          row.className = "row";
          const label = document.createElement("span");
          label.textContent = name;
          row.appendChild(label);
          if (UMBRELLAS.has(name)) {
            const tag = document.createElement("span");
            tag.className = "tag";
            tag.textContent = "umbrella";
            row.appendChild(tag);
          }
          list.appendChild(row);
        });
      }
      document.getElementById("count").textContent = filtered.length.toLocaleString() + " genres";
      document.getElementById("pageLabel").textContent =
        filtered.length === 0 ? "" : (start + 1) + "–" + (start + slice.length);
      document.getElementById("pages").textContent = "Page " + (page + 1) + " of " + pages;
      document.getElementById("prev").disabled = page <= 0;
      document.getElementById("next").disabled = page >= pages - 1;
    }

    Promise.all([
      fetch("data/extra-genres.txt").then((r) => r.text()),
      fetch("data/musicbrainz-genres.txt").then((r) => r.text()),
    ]).then(([extras, official]) => {
      const split = (text) => text.split(/\r?\n/).map((s) => s.trim()).filter(Boolean);
      const seen = new Set();
      names = [];
      split(extras).concat(split(official)).forEach((name) => {
        const key = name.toLowerCase();
        if (!seen.has(key)) {
          seen.add(key);
          names.push(name);
        }
      });
      matches();
    });

    document.getElementById("query").addEventListener("input", matches);
    document.getElementById("prev").addEventListener("click", () => { page -= 1; render(); });
    document.getElementById("next").addEventListener("click", () => { page += 1; render(); });
  </script>
</body>
</html>
